gunta",texts:["Dos sospechosos están siendo investigados por un delito cometido conjuntamente.","Son interrogados por separado y ninguno sabe qué va a declarar el otro.","Ambos deben decidir: confesar o no confesar."],question:"¿Cómo influyen las consecuencias esperadas en esa decisión y qué nos permite comprender sobre el interrogatorio?",options:["Confesar","No confesar"]},cl={title:"Las cuatro hipótesis",intro:"Cada sospechoso conoce las penas del supuesto, pero desconoce qué decidirá el otro.",clarification:`Aquí, cooperar entre los sospechosos significa que ambos guardan silencio: reciben dos años cada uno, frente a los cinco que recibirían si ambos confesaran.

Se trata de cooperación entre ellos para reducir sus penas, no de colaboración con la policía.`},ke={title:"¿Por qué ambos eligen confesar?",p1:{lead:"P1 compara sus opciones:",lines:["Si P2 confiesa, prefiere 5 años antes que 10.","Si P2 no confiesa, prefiere 1 año antes que 2."]},p2:{lead:"P2 realiza la misma comparación:",lines:["Si P1 confiesa, prefiere 5 años antes que 10.","Si P1 no confiesa, prefiere 1 año antes que 2."]},conclusion:"Si cada uno busca minimizar su propia pena en este supuesto, confesar es una estrategia dominante: ofrece un resultado individual mejor, haga lo que haga el otro.",option:"Confesar"},Be={title:"Equilibrio de Nash y cooperación",intro:"Ambos confiesan: cinco años de prisión cada uno.",nashLabel:"Equilibrio de Nash: 5 / 5",nashText:"Si el otro mantiene su decisión de confesar, cambiar unilateralmente al silencio elevaría la pena propia de 5 a 10 años.",jointLabel:"Resultado mejor para ambos: 2 / 2",jointText:"Ambos recibirían una pena menor si ninguno confesara. Sin embargo, si uno guarda silencio, el otro puede reducir su propia pena de 2 a 1 año confesando.",conclusion:"La búsqueda del beneficio individual conduce a un resultado peor para ambos que la cooperación mutua. Esa tensión constituye el dilema."},tt={title:"Del juego al interrogatorio",texts:["En el interrogatorio existe un conflicto entre el interés por esclarecer los hechos y las consecuencias que el sospechoso anticipa para sí mismo al declarar.","El dilema permite representar cómo la decisión propia depende también de lo que se espera que haga el otro sospechoso."],questions:["¿Qué habrá declarado el otro?","¿Qué consecuencias espero si confieso?","¿Qué consecuencias espero si no confieso?"],conclusion:"Su utilidad es ayudar a analizar la decisión de declarar en una situación de interdependencia."},bt={title:"Lo que la matriz no representa",intro:"El interrogatorio real incorpora elementos que esta matriz simplificada no representa.",blocks:["Incertidumbre: la persona puede desconocer las pruebas disponibles y las consecuencias de sus decisiones.","Estado emocional: emociones como el miedo o la ansiedad pueden influir en la disposición a declarar.","Interacción: las preguntas y las expectativas del investigador pueden influir en la información obtenida."],conclusion:"La decisión no debe interpretarse únicamente como un cálculo de años de prisión."},$e={title:"Decidir confesar no demuestra veracidad",intro:"Una explicación de por qué alguien confiesa no demuestra que su declaración sea verdadera.",blocks:["Es necesario distinguir entre mentira deliberada e información errónea transmitida sin intención de engañar.","No existe un indicador verbal o no verbal inequívoco que confirme la mentira.","El riesgo de confesiones falsas exige atender a cómo se obtiene la declaración. El modelo PEACE se basa en una entrevista no coercitiva y en la obtención de información."],conclusion:"Debemos diferenciar la decisión de confesar de la evaluación de la exactitud y credibilidad de lo declarado.",labels:["Decisión de confesar","Evaluación de lo declarado"]},Pe={title:"Nuestra valoración",label:"Valoración del grupo",texts:["Consideramos que el dilema del prisionero es útil para comprender el conflicto entre cooperación e interés individual y la importancia de las expectativas sobre el otro.","Su límite es que simplifica el interrogatorio: una matriz de penas no recoge por sí sola la incertidumbre, las emociones ni la interacción entre investigador y sospechoso.","Por ello, proponemos utilizarlo como una herramienta de análisis de decisiones, acompañada de una evaluación crítica de cómo se obtiene y contrasta la declaración."],message:"El dilema explica la decisión. No demuestra la culpabilidad.",closing:"Comprender por qué una persona confiesa es importante; comprobar la fiabilidad de lo que declara también lo es."},Ln={title:"Base académica",intro:"Esta infografía sintetiza el supuesto del dilema del prisionero y lo relaciona con los Temas 6
